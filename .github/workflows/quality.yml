name: Quality and security checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: TypeScript validation
        run: npm run check
      - name: Regression tests
        run: npm test
      - name: Audit production dependencies for high severity vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build
      - name: Chromium desktop and mobile smoke checks
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/mind-blogging-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser.smoke.mjs
